<script>try{var t=localStorage.getItem("site-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* Homepage · DESIGN.md §7: one filter row, real pictures, one card per experiment, textbook order per grade */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#EDEFF2; --ink:#13232B; --muted:#55666E; --line:#D9DCE1;
  --accent:#0A6A88; --on-accent:#FFFFFF; --phys:#0A6A88; --chem:#7A3F8F; --hot:#E2632B; --focus:#E2632B;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161A; --surface:#152229; --sunk:#0F1A1F; --ink:#E6EEF0; --muted:#9AB0B8; --line:#263840;
  --accent:#56C3DF; --on-accent:#06222B; --phys:#56C3DF; --chem:#D79BE0; --hot:#F0844F; --focus:#F59E5B; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E161A; --surface:#152229; --sunk:#0F1A1F; --ink:#E6EEF0; --muted:#9AB0B8; --line:#263840;
  --accent:#56C3DF; --on-accent:#06222B; --phys:#56C3DF; --chem:#D79BE0; --hot:#F0844F; --focus:#F59E5B; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 var(--sans);color:var(--ink);background:var(--bg)}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 64px}
@media (min-width:1600px){.wrap{max-width:1440px}}

/* top: brand */
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.mark{width:40px;height:40px;border-radius:10px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font:600 15px var(--mono);border-bottom:3px solid var(--hot)}
.brand b{display:block;font:800 17px/1.1 var(--display)}
.brand small{display:block;color:var(--muted);font-size:14px}

/* hero: title on the left, the newest lab on the right */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:28px;align-items:end;margin:34px 0 26px}
h1{margin:0;font:800 clamp(40px,5.4vw,72px)/.96 var(--display);letter-spacing:-.03em}
.lede{margin:14px 0 0;font-size:18px;color:var(--muted);max-width:34ch}
.newest{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px 10px 10px;transition:border-color .15s,transform .15s}
.newest:hover{border-color:var(--accent);transform:translateY(-2px)}
.newest img{width:150px;aspect-ratio:16/10;object-fit:cover;border-radius:9px;display:block;background:var(--sunk)}
.newest .kick{font:700 12.5px/1 var(--sans);color:var(--hot);letter-spacing:.02em}
.newest b{display:block;font:800 19px/1.15 var(--display);margin:5px 0 4px}
.newest span.g{font-size:14px;color:var(--muted)}

/* the one filter row */
.filters{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 0;margin-bottom:6px;background:var(--bg);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1 1 240px;max-width:380px}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:44px;padding:0 40px 0 38px;font:400 16px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;-webkit-appearance:none;appearance:none}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--muted);font:700 15px var(--sans);cursor:pointer;border-radius:8px}
.seg{display:inline-flex;padding:3px;gap:3px;border-radius:10px;background:var(--sunk);border:1px solid var(--line)}
.seg button{border:0;background:none;border-radius:7px;min-height:36px;padding:0 13px;font:700 14.5px/1 var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.seg .dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
.count{margin-left:auto;color:var(--muted);font-size:14px}

/* groups and cards */
.group{margin-top:26px}
.group h2{margin:0 0 12px;font:800 22px/1.2 var(--display);display:flex;align-items:baseline;gap:10px}
.group h2 .n{font:600 14px var(--sans);color:var(--muted)}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 26px rgba(19,35,43,.12)}
.card > a.main{text-decoration:none;display:flex;flex-direction:column;flex:1}
.card > a.main::after{content:"";position:absolute;inset:0;z-index:1}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--sunk);border-bottom:1px solid var(--line)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font:800 18px/1.2 var(--display);letter-spacing:-.005em}
.card .meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:14px;color:var(--muted)}
.card .meta .best{flex-basis:100%;font-size:12.5px;font-weight:700;color:#B36B00}
[data-theme="dark"] .card .meta .best{color:#F2B84B}@media (prefers-color-scheme:dark){html:not([data-theme="light"]) .card .meta .best{color:#F2B84B}}
.card .meta .sub::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.card.phys{--c:var(--phys)} .card.chem{--c:var(--chem)}
.card .badge{position:absolute;top:10px;left:10px;z-index:0;display:inline-flex;align-items:center;gap:5px;font:700 12.5px/1 var(--sans);padding:6px 9px 6px 7px;border-radius:999px;background:rgba(19,35,43,.82);color:#fff}
.card svg.hand{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card a.cam{position:relative;z-index:2;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;margin:-2px 14px 14px;padding:6px 10px;border-radius:8px;font:700 13.5px/1 var(--sans);color:var(--accent);background:var(--sunk);text-decoration:none}
.card a.cam:hover{background:var(--accent);color:var(--on-accent)}
.empty{margin:30px 0;color:var(--muted);font-size:17px}
.empty button{margin-left:8px;font:700 15px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}

/* footer */
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px;color:var(--muted);font-size:14.5px}
.foot b{color:var(--ink)}


/* header: brand on the left, dark mode on the right */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbtns{display:flex;gap:8px}
@media (max-width:420px){#tourBtn span{display:none}#tourBtn{width:40px;padding:0;justify-content:center}}
.theme{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14.5px/1 var(--sans);cursor:pointer;transition:border-color .15s,color .15s,transform .08s}
.theme:hover{border-color:var(--accent);color:var(--accent)}
.theme:active{transform:scale(.96)}
.theme svg{width:18px;height:18px;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.theme.turn svg{transform:rotate(180deg)}
@media (any-pointer:coarse){.theme{height:44px}}

/* calm motion: things arrive, nothing loops (PhET: busy moving screens make students freeze) */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero h1{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.hero .lede{animation:rise .6s .08s cubic-bezier(.2,.7,.2,1) both}
.newest{animation:rise .6s .16s cubic-bezier(.2,.7,.2,1) both}
.filters{animation:rise .5s .22s cubic-bezier(.2,.7,.2,1) both}
#list.anim .group h2{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
#list.anim .card{animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 32ms)}
.card img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.045)}
.card .body,.card a.cam{position:relative;background:var(--surface)}
.card a.cam{background:var(--sunk)}
.seg button{transition:background-color .18s,color .18s,box-shadow .18s}
.seg button:active{transform:scale(.97)}
html.theme-fade,html.theme-fade *{transition:background-color .3s,color .3s,border-color .3s!important}
@media (prefers-reduced-motion: reduce){.hero h1,.hero .lede,.newest,.filters,#list.anim .group h2,#list.anim .card{animation:none}.card img{transition:none}.card:hover img{transform:none}.theme svg{transition:none}}

/* share: a small button on every card opens a QR code for the board and a copy-link button */
.card .share{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid rgba(19,35,43,.14);background:rgba(255,255,255,.92);color:#13232B;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;opacity:.85;transition:opacity .15s,transform .15s,background-color .15s}
.card .share svg{width:18px;height:18px}
.card:hover .share,.card .share:focus-visible{opacity:1}
.card .share:hover{transform:scale(1.06);background:#fff}
@media (any-pointer:coarse){.card .share{width:44px;height:44px}}
.sh-back{position:fixed;inset:0;z-index:50;background:rgba(10,18,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sh{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px;animation:rise .28s cubic-bezier(.2,.7,.2,1) both}
.sh .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh h2{margin:0;font:800 21px/1.15 var(--display)}
.sh .hd small{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.sh .x{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px/1 var(--sans);cursor:pointer}
.sh .code{background:#fff;border-radius:12px;padding:10px;border:1px solid var(--line)}
.sh .code svg{display:block;width:100%;height:auto}
.sh .url{display:flex;gap:8px}
.sh .url input{flex:1 1 auto;min-width:0;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:500 13.5px var(--mono)}
.sh .btns{display:flex;gap:8px;flex-wrap:wrap}
.sh .b{flex:1 1 auto;height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.sh .b.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sh .b:active{transform:scale(.98)}
.sh .note{margin:0;color:var(--muted);font-size:13.5px}
.sh-back.big{padding:0}
.sh-back.big .sh{width:100%;height:100%;max-height:none;border-radius:0;align-items:center;justify-content:center}
.sh-back.big .code{width:min(78vh,86vw)}
.sh-back.big .url,.sh-back.big .note{display:none}
.sh-back.big .hd,.sh-back.big .btns{width:min(78vh,86vw)}
.sh-back.big h2{font-size:clamp(24px,3.4vw,44px)}
@media (prefers-reduced-motion: reduce){.sh-back,.sh{animation:none}}
@media print{.card .share,.sh-back{display:none}}


/* back to the filters: phones only (on wider screens the filter row stays on screen) */
.tofilters{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px/1 var(--sans);box-shadow:0 6px 20px rgba(0,0,0,.16);cursor:pointer;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s}
.tofilters.on{opacity:1;transform:none;pointer-events:auto}
.tofilters svg{width:18px;height:18px}
.tofilters .tf-n{font-weight:600;color:var(--muted);font-size:13.5px}
.tofilters .tf-n:empty{display:none}
@media (prefers-reduced-motion: reduce){.tofilters{transition:none}}
@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr);margin:22px 0 16px;gap:18px}
  .lede{font-size:16.5px}
  .filters{gap:8px}
  .search{flex-basis:100%;max-width:none}
  .filters{position:static}
  .count{display:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card h3{font-size:16px}
  .card .body{padding:10px 11px 12px}
  .card a.cam{margin:-2px 11px 12px}
  .newest{grid-template-columns:110px minmax(0,1fr)}
  .newest img{width:110px}
}
@media (max-width:420px){.seg button{padding:0 9px;font-size:14px}}
@media (prefers-reduced-motion: reduce){.card,.newest{transition:none}.card:hover,.newest:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="index.html"><span class="mark" aria-hidden="true">MK</span><span><b>Mr Khaled</b><small>Physics &amp; Chemistry</small></span></a>
  <span class="topbtns"><button type="button" class="theme" id="tourBtn" aria-label="Take a tour of this page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg><span>Tour</span></button>
  <button type="button" class="theme" id="themeBtn" aria-label="Dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><span>Dark</span></button></span>
</header>

<section class="hero">
  <div>
    <h1>Science<br>Simulations</h1>
    <p class="lede">Try the experiment before you read about it. Grades 7–12.</p>
  </div>
  <a class="newest" id="newest" href="#"><img alt="" id="nImg"><span><span class="kick">Newest</span><b id="nTitle"></b><span class="g" id="nMeta"></span></span></a>
</section>

<nav class="filters" aria-label="Find a lab">
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <label class="vh" for="q">Search the labs</label>
    <input id="q" type="search" placeholder="Search: waves, titration, half-life…" autocomplete="off" spellcheck="false">
    <button type="button" class="clear" id="qClear" hidden aria-label="Clear the search">✕</button>
  </div>
  <div class="seg" role="group" aria-label="Grade" id="gradeSeg">
    <button type="button" data-grade="all" aria-pressed="true">All grades</button>
    <button type="button" data-grade="7" aria-pressed="false" aria-label="Grade 7">7</button>
    <button type="button" data-grade="10" aria-pressed="false" aria-label="Grade 10">10</button>
    <button type="button" data-grade="11" aria-pressed="false" aria-label="Grade 11">11</button>
    <button type="button" data-grade="12" aria-pressed="false" aria-label="Grade 12">12</button>
  </div>
  <div class="seg" role="group" aria-label="Subject" id="subSeg">
    <button type="button" data-sub="all" aria-pressed="true">Both</button>
    <button type="button" data-sub="phys" aria-pressed="false" class="dot" style="--c:var(--phys)">Physics</button>
    <button type="button" data-sub="chem" aria-pressed="false" class="dot" style="--c:var(--chem)">Chemistry</button>
  </div>
  <span class="count" id="count" aria-live="polite"></span>
</nav>

<main id="list"></main>
<p class="empty" id="empty" hidden><span id="emptyMsg">No labs match.</span><button type="button" id="showAll">Show all labs</button></p>

<footer class="foot">
  <span>Every lab: <b>Intro · Lab · Challenge</b> screens, and a <b>Guide</b> for students and teachers.</span>
  <span>Designed and built by Mr Khaled for his students.</span>
</footer>
</div>

<script src="qr.js"></script>
<script>
/* ===== The labs. To add one: add a line here and run tools/thumbs.py for its picture. =====
   f file · t title · s phys|chem · g grades · tp topic group · sim number (newest = highest) · o textbook order (sorting only)
   m module label (only when the lab states it) · cam = its camera version · co = camera lab only · k words for search */
var LABS = [
{
"f": "acids-bases-ph-lab.html",
"t": "Acids, Bases and pH",
"s": "chem",
"g": "11",
"tp": "reactions",
"sim": 31,
"o": 17,
"k": "Pick a strong or weak acid or base, change its concentration and read pH, pOH, [H⁺] and [OH⁻] with a pH meter and universal indicator. Light a conductivity bulb in 0.10 M HCl and in acetic acid to see strong against weak, add drops of acid and base to water and to a buffer, and test salts such as NH₄Cl and KF with bromothymol blue.",
"m": "Module 17"
},
{
"f": "solutions-lab.html",
"t": "Solutions",
"s": "chem",
"g": "11",
"tp": "matter",
"sim": 30,
"o": 13,
"k": "Spoon a salt into 100 g of water until crystals stay, then heat or cool it and read the solubility curves (KCl, NaCl, KNO₃, AgNO₃, sugar, Ca(OH)₂). Make a supersaturated solution and drop in a seed crystal. Add sugar, NaCl or CaCl₂ to see the freezing point fall and the boiling point rise (ΔT = i·K·m), and shine a torch through a solution, a colloid and a suspension (Tyndall effect).",
"m": "Module 13"
},
{
"f": "states-of-matter-lab.html",
"t": "States of Matter",
"s": "chem",
"g": "11",
"tp": "matter",
"sim": 29,
"o": 11,
"k": "Heat ice until it melts and boils: the particles break out of the solid, the temperature stops on the heating curve while the energy breaks the forces. Compare dispersion forces, dipole–dipole forces and hydrogen bonds with boiling points, and drag a point around the phase diagrams of water and CO₂ (triple point, critical point, sublimation of dry ice).",
"m": "Module 11"
},
{
"f": "resonance-on-a-string.html",
"t": "Resonance on a String",
"s": "phys",
"g": "11",
"tp": "waves",
"sim": 3,
"o": 14.4,
"k": ""
},
{
"f": "pulse-at-a-boundary.html",
"t": "Pulse at a Boundary",
"s": "phys",
"g": "11",
"tp": "waves",
"sim": 4,
"o": 14.3,
"k": "Send a pulse from one spring into another and see which part reflects, which part passes through, and where the energy goes.",
"m": "Module 14"
},
{
"f": "wave-speed-lab.html",
"t": "Wave Speed Lab",
"s": "phys",
"g": "11",
"tp": "waves",
