 return [`Step 0 of 7. The skeleton equation: <b>${R.n.replace(/ \(.*\)/,'')}</b>${R.acid?' in acid solution':''}. Press <b>Next step</b>.`,
  `<b>1 · Oxidation numbers</b> of the atoms that change: ${o[3]} ${sgn(o[4])} → ${sgn(oP[4])}, ${rd[3]} ${sgn(rd[4])} → ${sgn(rP[4])}.`,
  `<b>2 · What changes?</b> ${o[3]} goes up (${sgn(o[4])} → ${sgn(oP[4])}): it loses electrons, it is <b>oxidized</b>, so ${o[0]} is the <b>reducing agent</b>. ${rd[3]} goes down (${sgn(rd[4])} → ${sgn(rP[4])}): it gains electrons, it is <b>reduced</b>, so ${rd[0]} is the <b>oxidizing agent</b>.`,
  R.onm?'<b>3 · Oxidation-number method:</b> write the change for each atom.':'<b>3 · Write the two half-reactions:</b> one for the oxidation, one for the reduction.',
  R.onm?'<b>4 · Electrons per atom:</b> Cu loses 2, each N that becomes NO₂ gains 1.':`<b>4 · Balance the atoms</b>${R.acid?': first the element that changes, then O with H₂O, then H with H⁺.':'.'}`,
  R.onm?'<b>5 · So one Cu needs two N atoms to be reduced.</b>':'<b>5 · Add electrons</b> so the charges balance on both sides of each half.',
  `<b>6 · Make the electrons equal:</b> multiply the oxidation by ${R.m[0]} and the reduction by ${R.m[1]}.`,
  `<b>7 · Add and check.</b> ${R.onm?'Add 2 more HNO₃ for the nitrate ions in Cu(NO₃)₂ (they do not change), then balance H and O with water.':'The electrons cancel.'} Atoms and charge are balanced: <b>${R.fin}</b>`][s]}
function blUI(){const R=RX[BL.r],s=BL.step;$('#bR').value=BL.r;$('#bMsg').innerHTML=blMsg(R,s);$('#bNext').disabled=s>=7;$('#bPrev').disabled=s<=0;
 const L=[];if(s>=3){L.push(`oxidation: ${R.h3[0]}`,`reduction: ${R.h3[1]}`)}if(s>=4&&!R.onm){L.length=0;L.push(`oxidation: ${R.h4[0]}`,`reduction: ${R.h4[1]}`)}if(s>=5){L.length=0;L.push(`oxidation: ${R.h5[0]}`,`reduction: ${R.h5[1]}`)}if(s>=6)L.push(`× ${R.m[0]} and × ${R.m[1]}`);if(s>=7)L.push('',`${R.fin}`);
 $('#bWork').innerHTML=L.map(x=>`<div>${x||'&nbsp;'}</div>`).join('')||'–';drawBC()}
let BG=null;
function drawBC(){const c=$('#bc');if(!c.offsetParent)return;const {x:X,w,h}=fit(c);X.clearRect(0,0,w,h);const R=RX[BL.r],s=BL.step,fin=s>=7;
 const sp=[...R.R.map((x,i)=>({x,side:0,i})),...R.P.map((x,i)=>({x,side:1,i}))];const fs=Math.min(30,w/(sp.length*5.2));X.font=`700 ${fs}px "IBM Plex Mono",monospace`;
 const items=[];sp.forEach((o,k)=>{const co=fin?o.x[2]:1,t=(co>1?co:'')+o.x[0];items.push({t,o});if(k<sp.length-1)items.push({t:k===R.R.length-1?' → ':' + ',op:true})});
 const ws=items.map(it=>X.measureText(it.t).width),tot=ws.reduce((a,b)=>a+b,0)+(fin&&R.acid?0:0);let x=w/2-tot/2;const y=h*.36;BG={y};const pos={};
 items.forEach((it,i)=>{txt(X,it.t,x,y,it.op?C.muted:C.ink,fs,'left','alphabetic',700);if(!it.op)pos[(it.o.side?'P':'R')+it.o.i]=x+ws[i]/2;x+=ws[i]});
 if(s>=1)sp.forEach(o=>{if(o.x[4]==null)return;const cx=pos[(o.side?'P':'R')+o.i],v=o.x[4],chg=(o.side===0&&(o.i===R.o[0]||o.i===R.r[0]))||(o.side===1&&(o.i===R.o[1]||o.i===R.r[1]));const col=!chg?C.muted:(o.side===0&&o.i===R.o[0])||(o.side===1&&o.i===R.o[1])?C.rose:C.solid;txt(X,`${o.x[3]} ${sgn(v)}`,cx,y-fs*1.1,col,fs*.55,'center','alphabetic',800)});
 if(s>=2){const arc=(a,b,up,col,lab)=>{const ya=up?y-fs*1.6:y+fs*.5;X.strokeStyle=col;X.lineWidth=2.5;X.beginPath();X.moveTo(a,ya);X.quadraticCurveTo((a+b)/2,ya+(up?-1:1)*fs*1.6,b,ya);X.stroke();X.beginPath();X.moveTo(b,ya);X.lineTo(b-7,ya+(up?-8:8));X.lineTo(b+5,ya+(up?-8:6));X.closePath();X.fillStyle=col;X.fill();txt(X,lab,(a+b)/2,ya+(up?-1:1)*fs*1.15+(up?0:12),col,Math.max(12,fs*.48),'center','alphabetic',700)};
  const eo=R.o[2]*(s>=6?R.m[0]:1),er=R.r[2]*(s>=6?R.m[1]:1);arc(pos['R'+R.o[0]],pos['P'+R.o[1]],true,C.rose,`oxidized: loses ${eo} e⁻${s>=6&&R.m[0]>1?` (× ${R.m[0]})`:''}`);arc(pos['R'+R.r[0]],pos['P'+R.r[1]],false,C.solid,`reduced: gains ${er} e⁻${s>=6&&R.m[1]>1?` (× ${R.m[1]})`:''}`)}
 if(s>=3){const hs=s>=5?R.h5:s>=4&&!R.onm?R.h4:R.h3,hy=h*.7,f2=Math.max(11,Math.min(20,w/42));txt(X,'oxidation:  '+hs[0]+(s>=6?`   × ${R.m[0]}`:''),w/2,hy,C.rose,f2,'center','alphabetic',700);txt(X,'reduction:  '+hs[1]+(s>=6?`   × ${R.m[1]}`:''),w/2,hy+f2*1.8,C.solid,f2,'center','alphabetic',700)}
 if(fin)txt(X,'atoms ✓   charge ✓   electrons lost = electrons gained ✓',w/2,h-18,C.ok,13,'center','alphabetic',700,'"IBM Plex Sans",sans-serif')}

/* =========================================================
   EXERCISE
   ========================================================= */
const EXEG=[{k:'ox',v:{f:'KClO3'},s:'What is the oxidation number of chlorine in potassium chlorate, KClO₃?'},{k:'ox',v:{f:'SO3^2-'},s:'What is the oxidation number of sulfur in the sulfite ion, SO₃²⁻?'},{k:'ox',v:{f:'Cr2O7^2-'},s:'What is the oxidation number of chromium in the dichromate ion, Cr₂O₇²⁻?'},
 {k:'bal',v:{r:'4'},s:'Balance by the oxidation-number method: Cu + HNO₃ → Cu(NO₃)₂ + NO₂ + H₂O.'},{k:'bal',v:{r:'5'},s:'Balance the net ionic equation in acid solution: ClO₄⁻ + Br⁻ → Cl⁻ + Br₂.'},{k:'bal',v:{r:'6'},s:'Balance in acid solution with half-reactions: MnO₄⁻ + Sn²⁺ → Mn²⁺ + Sn⁴⁺.'}];
let exk='ox';const ex={v:{},story:null};
function exBuild(){const v=ex.v;$('#exF').innerHTML=exk==='ox'?`<label>Formula (e.g. KClO3, SO3^2-)<input data-v="f" autocomplete="off" value="${v.f??''}"></label>`:`<label>Reaction<select data-v="r">${RX.map((r,i)=>`<option value="${i}"${+v.r===i?' selected':''}>${r.n}</option>`).join('')}</select></label>`;
 $$('#exF [data-v]').forEach(i=>i.addEventListener(i.tagName==='SELECT'?'change':'input',()=>{ex.v[i.dataset.v]=i.value;ex.story=null;exUpdate()}));exUpdate()}
function exSolve(){if(exk==='bal')return {R:RX[+ex.v.r]};const P=parseF(ex.v.f||'');const ok=P&&oxNums(P).ok;$$('#exF [data-v]').forEach(i=>i.toggleAttribute('aria-invalid',!ok));return ok?{P,r:oxNums(P)}:null}
function exUpdate(){const r=exSolve();if(!r){$('#exMsg').textContent='Type a formula the rules can solve (only one unknown element), e.g. Na2Cr2O7 or NO3-.';$('#exText').innerHTML='';return null}$('#exMsg').textContent='Ready. Press “Solve it in the lab” to work through it.';
 $('#exText').innerHTML=ex.story||(exk==='ox'?`Assign oxidation numbers to every element in ${prettyF(ex.v.f)}.`:`Balance: ${r.R.n}.`);return r}
function setExK(k,eg){exk=k;segPick($(`[data-exk="${k}"]`));const d=eg||EXEG.find(e=>e.k===k);ex.v={...d.v};ex.story=d.s;exBuild()}
$$('[data-exk]').forEach(b=>b.onclick=()=>setExK(b.dataset.exk));let egi=1;$('#exEg').onclick=()=>{const e=EXEG[egi++%EXEG.length];setExK(e.k,e)};
$('#exSolve').onclick=()=>{const r=exUpdate();if(!r){$('#exMsg').textContent='Fix the red box first.';return}tourGo(exSteps(r))};
function exSteps(r){if(exk==='ox'){const f=ex.v.f,S=[{title:'Solve it in the lab',html:'<p>Use the rules in order, then make the total equal the charge.</p>',onShow:()=>{go('ox');OX.f=f;$('#oT').value=f;oUI()}}];
  r.r.rules.forEach((x,i)=>S.push({el:'#oRules',title:`Rule ${i+1}`,html:`<p>${x}</p>`}));S.push({el:'#oc',title:'Your answer',html:calc(r.P.order.map(e=>`${e}: ${sgn(r.r.k[e])}`).join('   '))});return S}
 const i=+ex.v.r,S=[{title:'Solve it in the lab',html:'<p>Electrons lost must equal electrons gained. Work through the seven steps.</p>',onShow:()=>{go('bal');BL.r=i;BL.step=0;blUI()}}];
 for(let s=1;s<=7;s++)S.push({el:'#bc',title:'Step '+s,html:'',onShow:function(){BL.r=i;BL.step=s;blUI();this.html='<p>'+blMsg(RX[i],s)+'</p>'+(s>=3?calc($('#bWork').innerText):'')}});return S}

/* =========================================================
   CHALLENGE
   ========================================================= */
const GEN=[
 ()=>{const f=pick(OXL.filter(x=>parseF(x).order.length>1)),P=parseF(f),r=oxNums(P),u=r.u||P.order[0],v=r.k[u];return [`What is the oxidation number of ${u} in ${prettyF(f)}?`,uniq(v,[-v,v+2,v-1],'',sgn),0,r.rules[r.rules.length-1]]},
 ()=>{const R=pick(RX),o=R.R[R.o[0]];return [`In ${R.n.replace(/ \(.*\)/,'')}, which species is oxidized?`,[o[0],R.R[R.r[0]][0],...R.P.map(x=>x[0])].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4),0,`${o[3]} goes from ${sgn(o[4])} to ${sgn(R.P[R.o[1]][4])}: it loses electrons.`]},
 ()=>{const R=pick(RX),rd=R.R[R.r[0]];return [`In ${R.n.replace(/ \(.*\)/,'')}, which is the oxidizing agent?`,[rd[0],R.R[R.o[0]][0],...R.P.map(x=>x[0])].filter((x,i,a)=>a.indexOf(x)===i).slice(0,4),0,`${rd[0]} is reduced (${sgn(rd[4])} → ${sgn(R.P[R.r[1]][4])}), so it is the oxidizing agent.`]},
 ()=>{const R=pick(RX.filter(r=>!r.onm)),e=R.o[2]*R.m[0];return [`How many electrons are transferred in the balanced equation ${R.fin}?`,uniq(e,[R.o[2],R.r[2],e*2],'',x=>String(Math.round(x))),0,`${R.h5[0]} (× ${R.m[0]}) and ${R.h5[1]} (× ${R.m[1]}): ${e} electrons.`]},
 ()=>pick([
  ['Oxidation is…',['loss of electrons','gain of electrons','gain of protons','loss of neutrons'],0,'LEO GER: Lose Electrons Oxidation, Gain Electrons Reduction.'],
  ['What is the oxidation number of an uncombined element such as O₂ or Fe?',['0','+1','−2','It depends on the element'],0,'Elements on their own always have oxidation number 0.'],
  ['In which compound is the oxidation number of O equal to −1?',['H₂O₂','H₂O','CO₂','OF₂'],0,'Peroxides contain O–O bonds; each O is −1. In OF₂, O is +2.'],
  ['In NaH, the oxidation number of hydrogen is…',['−1','+1','0','+2'],0,'In metal hydrides H is bonded to a less electronegative metal, so it is −1.'],
  ['When balancing in acid solution, oxygen atoms are balanced with…',['H₂O','O₂','OH⁻','H⁺'],0,'Add water for O, then H⁺ for H, then electrons for charge.']])];
