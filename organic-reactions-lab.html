$('#pM').innerHTML=MON.map((m,i)=>`<option value="${i}">${m.n}</option>`).join('');$('#pM').onchange=e=>{PL.m=+e.target.value;PL.n=0;plUI()};
$('#pAdd').onclick=()=>{if(PL.n<40){PL.n++;PL.anim=performance.now();plUI()}};$('#pAuto').onclick=()=>{PL.auto=!PL.auto;$('#pAuto').textContent=PL.auto?'Stop':'Grow it'};$('#pReset').onclick=()=>{PL.n=0;PL.auto=false;$('#pAuto').textContent='Grow it';plUI()};
function plMass(m,n){if(!m.cond)return n*m.M;let s=0;for(let i=0;i<n;i++)s+=i%2?m.B[1]:m.A[1];return s-Math.max(0,n-1)*18.02}
function plUI(){const m=MON[PL.m];$('#pM').value=PL.m;$('#pN').textContent=PL.n;$('#pMM').textContent=PL.n?sf(plMass(m,PL.n),4)+' g/mol':'–';$('#pW').textContent=m.cond?Math.max(0,PL.n-1)+' H₂O':'none (addition)';$('#pCode').textContent=m.code;
 $('#pMsg').innerHTML=m.cond?`<b>Condensation polymer:</b> each new link (${m.link}) releases one water molecule. Two different monomers alternate. Uses: ${m.use}.`:`<b>Addition polymer:</b> the C=C double bond of ${m.n} opens and the monomers join end to end. Nothing is released, so the polymer has the same atoms as the monomers. The repeating unit (in brackets) is the monomer with its double bond opened. Uses: ${m.use}.`;drawPC()}
function drawPC(){const c=$('#pc');if(!c.offsetParent)return;const {x:X,w,h}=fit(c);X.clearRect(0,0,w,h);const m=MON[PL.m],t=PL.anim?clamp((performance.now()-PL.anim)/600,0,1):1,cy=h*.5;
 txt(X,m.p,w/2,26,C.ink,15,'center','alphabetic',800,'"IBM Plex Sans",sans-serif');
 if(m.cond){const bw=Math.min(150,w/5.5),bh=40,shown=Math.min(PL.n,Math.floor((w-40)/(bw*.9))),x0=w/2-shown*bw*.9/2;for(let i=0;i<shown;i++){const A=i%2===0,x=x0+i*bw*.9;X.fillStyle=alpha(A?C.solid:C.rose,.18);X.strokeStyle=A?C.solid:C.rose;X.lineWidth=2;rrect(X,x,cy-bh/2,bw*.8,bh,10);X.fill();X.stroke();txt(X,(A?m.A:m.B)[0],x+bw*.4,cy+5,C.ink,Math.max(9,bw*.075),'center','alphabetic',700);
   if(i>0){txt(X,m.link,x-bw*.05,cy-bh/2-8,C.brass,11,'center','alphabetic',700,'"IBM Plex Sans",sans-serif');const k=i===PL.n-1?t:1;txt(X,'H₂O',x-bw*.05,cy+bh/2+20+k*30,alpha(C.fill,1-k*.6),13,'center','alphabetic',700)}}
  if(PL.n>shown)txt(X,`… ${PL.n} monomers in total`,w/2,cy+bh+70,C.muted,12,'center','alphabetic',600);if(!PL.n)txt(X,'Add monomers: '+m.A[0]+'  and  '+m.B[0],w/2,cy,C.muted,13,'center','alphabetic',600);return}
 const D=Math.min(48,w/16),uw=D*2.4,shown=Math.min(PL.n,Math.floor((w-120)/uw)),x0=w/2-shown*uw/2,fs=Math.max(11,D*.42);
 const atom=(x,y,s,col)=>{X.fillStyle=C.stage;X.beginPath();X.arc(x,y,fs*.7,0,7);X.fill();txt(X,s,x,y+fs*.36,col,s.length>2?fs*.75:fs,'center','alphabetic',700)};
 if(!PL.n){const cx=w/2;X.strokeStyle=C.ink;X.lineWidth=2.2;[-3,3].forEach(o=>{X.beginPath();X.moveTo(cx-D*.5,cy+o);X.lineTo(cx+D*.5,cy+o);X.stroke()});atom(cx-D*.6,cy,'C',C.ink);atom(cx+D*.6,cy,'C',C.ink);[[-1.2,-.8,0],[-1.2,.8,1],[1.2,-.8,2],[1.2,.8,3]].forEach(([dx,dy,k])=>{X.beginPath();X.moveTo(cx+dx*D*.5,cy+dy*D*.5);X.lineTo(cx+dx*D,cy+dy*D);X.stroke();atom(cx+dx*D,cy+dy*D,m.s[k],C.ink)});txt(X,'monomer: '+m.n,cx,cy+D*1.8,C.muted,12,'center','alphabetic',600);return}
 X.strokeStyle=C.ink;X.lineWidth=2.2;X.beginPath();X.moveTo(x0-D*.3,cy);X.lineTo(x0+shown*uw+D*.3,cy);X.stroke();
 for(let i=0;i<shown;i++){const xa=x0+i*uw+uw*.25,xb=x0+i*uw+uw*.75,a=i===shown-1?t:1;X.globalAlpha=a;[[xa,0,1],[xb,2,3]].forEach(([x,u,d])=>{X.beginPath();X.moveTo(x,cy-fs*.7);X.lineTo(x,cy-D);X.moveTo(x,cy+fs*.7);X.lineTo(x,cy+D);X.stroke();atom(x,cy-D,m.s[u],C.ink);atom(x,cy+D,m.s[d],m.s[d]!=='H'&&m.s[d]!=='F'?C.accent:C.ink);atom(x,cy,'C',C.ink)});X.globalAlpha=1}
 const bx=x0+uw*0-2,bw2=uw;X.strokeStyle=C.brass;X.lineWidth=2.5;[[bx,1],[bx+bw2,-1]].forEach(([x,d])=>{X.beginPath();X.moveTo(x+d*6,cy-D*1.45);X.lineTo(x,cy-D*1.45);X.lineTo(x,cy+D*1.45);X.lineTo(x+d*6,cy+D*1.45);X.stroke()});txt(X,'n',bx+bw2+6,cy+D*1.6,C.brass,15,'left','alphabetic',800);txt(X,'repeating unit',bx+bw2/2,cy-D*1.65,C.brass,11.5,'center','alphabetic',700,'"IBM Plex Sans",sans-serif');
 if(PL.n>shown)txt(X,`… ${PL.n} units`,x0+shown*uw+D,cy-8,C.muted,12,'left','alphabetic',600)}

const RCT=[['ethane','ethane'],['ethene','ethene'],['ethanol','ethanol'],['bromoethane','bromoethane'],['chloroethane','chloroethane'],['acid','ethanoic acid'],['ethanal','ethanal']];
const RGT=[['Cl₂','Cl₂ in UV light'],['OH⁻','OH⁻(aq)'],['NH₃','NH₃'],['H₂O','H₂O with H⁺'],['H₂','H₂ with a Ni catalyst'],['HBr','HBr'],['Br₂','Br₂ (bromine water)'],['heat','heat with a catalyst'],['H2SO4','concentrated H₂SO₄, heat'],['[O]','acidified K₂Cr₂O₇'],['ethanol','ethanol with H₂SO₄'],['OHeth','OH⁻ in hot ethanol']];
function findRx(a,g){const map={'Cl₂':0,'OH⁻':1,'NH₃':2,'heat':3,'H2SO4':4,'OHeth':5,'H₂O':6,'H₂':7,'HBr':8,'Br₂':9,'ethanol':10};
 const T={ethane:{'Cl₂':0,heat:3},bromoethane:{'OH⁻':1,OHeth:5},chloroethane:{'NH₃':2},ethanol:{H2SO4:4,'[O]':11},ethene:{'H₂O':6,'H₂':7,HBr:8,'Br₂':9},acid:{ethanol:10},ethanal:{'[O]':12}};return T[a]&&T[a][g]!=null?T[a][g]:-1}
const EXEG=[{k:'rx',v:{a:'ethene',g:'Br₂'},s:'Ethene is bubbled through bromine water. Name the product and the type of reaction.'},{k:'rx',v:{a:'ethanol',g:'H2SO4'},s:'Ethanol is heated with concentrated sulfuric acid. What forms, and what type of reaction is it?'},{k:'rx',v:{a:'acid',g:'ethanol'},s:'Ethanoic acid is warmed with ethanol and a little sulfuric acid. What forms?'},{k:'rx',v:{a:'ethane',g:'Cl₂'},s:'Ethane and chlorine are mixed in UV light. Predict the products.'},{k:'poly',v:{m:'2',n:'1000'},s:'A PVC chain is made from 1000 chloroethene molecules. Draw the repeating unit and find the molar mass of the chain.'}];
let exk='rx';const ex={v:{},story:null};
function exBuild(){const v=ex.v;$('#exF').innerHTML=exk==='rx'?`<label>Starting molecule<select data-v="a">${RCT.map(([k,n])=>`<option value="${k}"${v.a===k?' selected':''}>${n}</option>`).join('')}</select></label><label>Reagent / conditions<select data-v="g">${RGT.map(([k,n])=>`<option value="${k}"${v.g===k?' selected':''}>${n}</option>`).join('')}</select></label>`
 :`<label>Monomer<select data-v="m">${MON.filter(m=>!m.cond).map((m,i)=>`<option value="${i}"${+v.m===i?' selected':''}>${m.n}</option>`).join('')}</select></label><label>Number of monomers n<input data-v="n" inputmode="decimal" value="${v.n??''}"></label>`;
 $$('#exF [data-v]').forEach(i=>i.addEventListener(i.tagName==='SELECT'?'change':'input',()=>{ex.v[i.dataset.v]=i.value;ex.story=null;exUpdate()}));exUpdate()}
function exSolve(){const v=ex.v;if(exk==='rx'){const i=findRx(v.a,v.g);$$('#exF [data-v]').forEach(x=>x.toggleAttribute('aria-invalid',i<0));return i<0?null:{i,R:RX[i]}}const n=num(v.n);const ok=n>=2&&Number.isInteger(n);$$('#exF [data-v]').forEach(x=>x.toggleAttribute('aria-invalid',x.dataset.v==='n'&&!ok));return ok?{m:MON[+v.m],n,M:MON[+v.m].M*n}:null}
function exUpdate(){const r=exSolve();if(!r){$('#exMsg').textContent=exk==='rx'?'These two do not react in this lab. Try another reagent.':'Type a whole number of monomers (2 or more).';$('#exText').innerHTML='';return null}$('#exMsg').textContent='Ready. Press “Solve it in the lab” to work through it.';
 $('#exText').innerHTML=ex.story||(exk==='rx'?`${RCT.find(x=>x[0]===ex.v.a)[1]} + ${RGT.find(x=>x[0]===ex.v.g)[1]}: predict the product and the type of reaction.`:`${r.n} molecules of ${r.m.n} polymerise. Find the molar mass of the chain.`);return r}
function setExK(k,eg){exk=k;segPick($(`[data-exk="${k}"]`));const d=eg||EXEG.find(e=>e.k===k);ex.v={...d.v};ex.story=d.s;exBuild()}
$$('[data-exk]').forEach(b=>b.onclick=()=>setExK(b.dataset.exk));let egi=1;$('#exEg').onclick=()=>{const e=EXEG[egi++%EXEG.length];setExK(e.k,e)};
$('#exSolve').onclick=()=>{const r=exUpdate();if(!r){$('#exMsg').textContent='Fix the red box first.';return}tourGo(exSteps(r))};
function exSteps(r){if(exk==='rx'){const R=r.R;return [{title:'Solve it in the lab',html:'<p>Look at the functional group of the starting molecule and the reagent.</p>',onShow:()=>{go('rx');OR.ty='';segPick($('[data-ty=""]'));OR.r=r.i;OR.t=0;orUI()}},
  {el:'#rc',title:'What can react?',html:`<p>${{Substitution:'A single-bonded molecule with a group that can be swapped.',Elimination:'Atoms on neighbouring carbons can leave to make a double bond.',Addition:'A C=C double bond can open up and add atoms.',Condensation:'Two molecules can join and release water.',Oxidation:'An oxidizing agent can remove H atoms or add O.'}[R.type]}</p>`},
  {el:'#rGo',title:'React',html:'<p>Press <b>React</b>.</p>',wait:()=>OR.t>=1,doIt:()=>{OR.anim=performance.now()},done:'The product is drawn with the changed atoms coloured.'},
  {title:'Your answer',html:calc(`${R.R.map(x=>MOL[x]?MOL[x].n:x).join(' + ')} → ${R.P.map(x=>MOL[x]?MOL[x].n:x).join(' + ')}\ntype: ${R.type.toLowerCase()}`)+`<p>${R.m}</p>`}]}
 const mi=MON.indexOf(r.m);return [{title:'Addition polymer',html:'<p>The double bond opens; n monomers join and nothing is lost.</p>',onShow:()=>{go('poly');PL.m=mi;PL.n=6;plUI()}},{el:'#pc',title:'Repeating unit',html:`<p>The repeating unit is the monomer with its C=C opened to C–C: shown in the brackets.</p>`},{title:'Molar mass',html:calc(`M = n × M(monomer) = ${r.n} × ${r.m.M} g/mol\nM = ${sf(r.M,4)} g/mol`)},{title:'Your answer',html:calc(`${sf(r.M,4)} g/mol`)}]}

 ()=>pick([
  ['Which test shows that a compound has a C=C double bond?',['Bromine water loses its brown colour','It turns limewater milky','It turns blue litmus red','It burns with a yellow flame'],0,'Br₂ adds across the double bond and is used up.'],
