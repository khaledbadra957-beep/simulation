$$('[data-exk]').forEach(b=>b.onclick=()=>setExK(b.dataset.exk));let egi=1;$('#exEg').onclick=()=>{const e=EXEG[egi++%EXEG.length];setExK(e.k,e)};
$('#exSolve').onclick=()=>tourGo(exSteps(exUpdate()));
function exSteps(k){const c=k.c,a=k.a,ci=+ex.v.cat,ai=+ex.v.an,S=[];
 if(exk==='formula'){S.push({title:'Solve it in the lab',html:`<p>1. Find the charge of each ion. 2. Use the smallest numbers that make the total charge zero.</p>`});
  S.push({el:'#iCat',title:'1 · The ions',html:`<p><b>${c[0]}${supc(c[2])}</b>: ${c[3]?`group ${c[3]===3?13:c[3]}, loses ${c[3]} electron${c[3]>1?'s':''}`:c[5]?'a polyatomic cation':'its charge is given'}.<br><b>${a[0]}${supc(a[2])}</b>: ${a[3]?`group ${a[3]+10}, gains ${-a[2]}`:'a polyatomic ion'}.</p>`,onShow:()=>{go('ion');IB.cat=ci;IB.an=ai;IB.t=0;IB.anim=null;iUI()}});

  S.push({el:()=>$('#ic'),title:'3 · Balance the charges',html:calc(`${k.nc} × (+${c[2]}) = +${k.e}\n${k.na} × (${mns(a[2])}) = −${k.e}\ntotal = 0`)+(k.na>1&&a[4]||k.nc>1&&c[5]?'<p>Put brackets round a polyatomic ion when you need more than one.</p>':'')});
  S.push({title:'Your answer',html:calc(`${k.formula}   (${k.name})`)});return S}

 S.push({title:'1 · The cation',html:c[4]?`<p>${c[1][0].toUpperCase()+c[1].slice(1)} can form more than one ion, so work out its charge from the anions and write it as a Roman numeral (Stock name).</p>`+calc(`${k.na} × (${mns(a[2])}) = −${k.e}  →  ${k.nc} ${c[0]} = +${k.e}  →  ${c[0]}${supc(c[2])}\nname: ${c[4]}`):`<p>${c[0]}${supc(c[2])}: <b>${c[1]}</b>${c[5]?' (a polyatomic cation)':'. Metals with only one ion keep their element name'}.</p>`,onShow:()=>{go('ion');IB.cat=ci;IB.an=ai;IB.t=1;IB.anim=null;iUI()}});
