<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Activity 4 — Preparing mixtures (Page 19, Worksheet 2.4)</title>
<style>
:root{
  --ink:#1d2b3a; --green:#2e9e5b; --green-d:#1f7a43; --green-l:#e3f6ea;
  --orange:#e07b1a; --orange-l:#fdeeda; --blue:#2b6cb0; --paper:#fbf8f0;
  --deck:#101a2b; --deck2:#1a2740; --acc:#4fd1c5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 30% 20%,#17324f 0%,#0b1626 60%,#060c16 100%);overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;
  background:radial-gradient(ellipse at 30% 20%,#17324f 0%,#0b1626 60%,#060c16 100%)}
button{font:inherit;cursor:pointer}

/* ---------- stage ---------- */
#stage{position:relative;width:min(100%,calc((100vh - 158px)*16/9));min-width:300px;aspect-ratio:16/9;container-type:size;
  border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#12314d,#0a1a2e 70%);
  box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.06)}
.bub{position:absolute;bottom:-6%;border-radius:50%;border:1px solid rgba(160,230,255,.35);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(120,200,255,.05));animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,0)}50%{transform:translate(1.2cqw,-35cqw)}to{transform:translate(-.8cqw,-70cqw);opacity:0}}

#board{position:absolute;left:1.6%;right:1.6%;top:2.4%;bottom:16.5%;background:var(--paper);border-radius:1.1cqw;
  box-shadow:0 .4cqw 1.6cqw rgba(0,0,0,.45);font-size:1.5cqw;overflow:hidden;
  background-image:linear-gradient(rgba(60,110,160,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(60,110,160,.045) 1px,transparent 1px);background-size:2.2cqw 2.2cqw}
.scene{position:absolute;inset:0;padding:.9em 1.2em;display:none;flex-direction:column;gap:.55em}
.scene.active{display:flex}
[data-show]{opacity:0;transform:translateY(.8em);transition:opacity .55s,transform .55s;pointer-events:none}
[data-show].on{opacity:1;transform:none;pointer-events:auto}
.stitle{display:flex;align-items:center;gap:.6em;font-weight:700;color:#35506b;font-size:.95em;flex:none}
.stitle .badge{font-size:.8em}
.badge{background:var(--green);color:#fff;font-weight:800;padding:.18em .7em;border-radius:.4em;letter-spacing:.02em;white-space:nowrap}
.spk{border:none;background:#e6eef7;color:#234;border-radius:50%;width:1.9em;height:1.9em;font-size:.85em;line-height:1;flex:none;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.spk:hover{background:#cfe3f7;transform:scale(1.12)}
.card{background:#fff;border:1px solid #dfe5ec;border-radius:.7em;padding:.6em .8em;box-shadow:0 .15em .5em rgba(20,40,70,.08);position:relative}
.row{display:flex;gap:.8em;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:.55em;min-width:0}

/* scene 1 */
.hdr{display:flex;align-items:center;gap:.8em}
.hdr .badge{font-size:1.25em}
.hdr h1{margin:0;font-size:2.1em;color:#1f4f85;letter-spacing:.01em}
.hdr .pg{margin-left:auto;color:#6b7c8f;font-size:.85em;font-weight:600}
.principle{font-size:1.22em;line-height:1.4;display:flex;gap:.6em;align-items:flex-start;border-left:.35em solid var(--blue)}
.banner{background:var(--green);color:#fff;font-weight:800;font-size:1.2em;padding:.45em .9em;border-radius:.5em;display:flex;align-items:center;gap:.6em;
  box-shadow:0 .2em .6em rgba(30,120,70,.3)}
.banner .spk{background:rgba(255,255,255,.25);color:#fff}
.hook{flex:1;min-height:0;display:flex;gap:1em;align-items:stretch}
.hook .card{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;padding:.4em}
.hook svg{flex:1;min-height:0;width:100%}
.hook .cap{font-weight:700;text-align:center;font-size:.95em}
.vs{align-self:center;font-weight:900;font-size:1.6em;color:#9aa9ba}

/* experiments */
.exp{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.45em .6em}
.exp .eh{display:flex;align-items:center;gap:.5em;font-weight:800;color:#1f4f85;flex:none}
.exp .eh .t{flex:1}
.exp svg{flex:1;min-height:0;width:100%;display:block}
.exp text{font-family:inherit}
.badges{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center;flex:none;min-height:1.7em}
.pill{font-size:.78em;font-weight:800;padding:.2em .7em;border-radius:99px;white-space:nowrap}
.pill.ph{background:#e6eef7;color:#1f4f85}
.pill.ho{background:var(--green-l);color:var(--green-d);border:1px solid #9bd8b3}
.pill.he{background:var(--orange-l);color:#a85608;border:1px solid #f2c48d}
.pill.mi{background:#ebe4fb;color:#5b34a8;border:1px solid #c9b8f1}
.exp .fall,.exp .arrow,.exp .after,.exp .rot,.exp .badges,.exp .lblafter{opacity:0;transition:opacity .6s}
.exp .tint,.exp .bits{opacity:0;transition:opacity 2.2s}
.exp[data-state=add] .fall,.exp[data-state=mix] .fall,.exp[data-state=wait] .fall,.exp[data-state=result] .fall{opacity:1}
.exp[data-state=stir] .rot,.exp[data-state=mix] .rot,.exp[data-state=wait] .rot,.exp[data-state=result] .rot{opacity:1}
.exp[data-state=wait] .arrow,.exp[data-state=result] .arrow{opacity:1}
.exp[data-state=result] .after,.exp[data-state=result] .badges,.exp[data-state=result] .lblafter{opacity:1}
.exp[data-state=add] .tint{opacity:.28}.exp[data-state=stir] .tint{opacity:.9}
.exp[data-state=mix] .tint,.exp[data-state=wait] .tint,.exp[data-state=result] .tint{opacity:.5}
.exp[data-state=add] .bits{opacity:.55}
.exp[data-state=stir] .bits,.exp[data-state=mix] .bits,.exp[data-state=wait] .bits,.exp[data-state=result] .bits{opacity:1}
.exp[data-state=add] .tool{animation:wig .5s ease-in-out infinite alternate}
.exp[data-state=stir] .rod,.exp[data-state=mix] .rod,.exp[data-state=wait] .rod,.exp[data-state=result] .rod{animation:stir .55s ease-in-out infinite alternate}
.exp[data-state=stir] .bits>*{animation:drift 1.1s ease-in-out infinite alternate}
.exp .fall .p{animation:fall 1s linear infinite}
.exp .fall .stream{animation:dash .35s linear infinite}
.exp .rot{animation:pulse .9s ease-in-out infinite alternate}
.exp .hand{animation:spin 2.4s linear infinite;transform-origin:200px 108px}
@keyframes wig{from{transform:translateY(0)}to{transform:translateY(3px)}}
@keyframes stir{from{transform:translateX(-9px) rotate(-2deg)}to{transform:translateX(9px) rotate(2deg)}}
@keyframes drift{from{transform:translate(-5px,2px)}to{transform:translate(5px,-3px)}}
@keyframes fall{from{transform:translateY(0);opacity:1}85%{opacity:1}to{transform:translateY(var(--d,70px));opacity:0}}
@keyframes dash{to{stroke-dashoffset:-9}}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.notes{flex:0 0 33%;justify-content:center}
.note{font-size:.95em;line-height:1.35;padding:.45em .7em}
.note b{color:#1f4f85}
.note.ok{background:var(--green-l);border-color:#9bd8b3}
.note.no{background:var(--orange-l);border-color:#f2c48d}

/* boxes */
.misc{border:.15em solid #d58a2f;background:#fff8ec;border-radius:.6em;padding:.45em .8em;font-size:.98em;line-height:1.4;display:flex;gap:.6em;align-items:center;flex:none}
.bilan{border:.15em solid var(--green);background:var(--green-l);border-radius:.6em;padding:.6em .9em;line-height:1.45}
.bilan h3{margin:0 0 .3em;display:flex;align-items:center;gap:.5em}
.bilan h3 span{background:var(--green);color:#fff;padding:.1em .8em;border-radius:.35em}

/* grid scene */
.grid6{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:.5em}
.grid6 .exp{cursor:pointer;transition:transform .15s,box-shadow .15s;font-size:.86em}
.grid6 .pill{font-size:.7em;padding:.15em .55em}
.grid6 .exp:hover{transform:translateY(-.15em);box-shadow:0 .4em 1em rgba(30,80,140,.25);border-color:#7fb2e6}
.hint{font-size:.85em;color:#55708c;font-weight:600;margin-left:auto}
#closeup{position:absolute;inset:0;background:rgba(10,22,38,.72);display:none;align-items:center;justify-content:center;z-index:5}
#closeup.open{display:flex}
#closeup .box{width:78%;height:92%;background:#fff;border-radius:.9em;padding:.7em;display:flex;flex-direction:column;gap:.4em;font-size:1.25em}
#closeup .exp{flex:1;border:none;box-shadow:none}
#closeup .bar{display:flex;align-items:center;gap:.6em;font-size:.75em}
#closeup .phase{font-weight:800;color:#1f4f85;flex:1}
.btn{border:none;background:#2b6cb0;color:#fff;font-weight:700;border-radius:.5em;padding:.4em .9em}
.btn:hover{filter:brightness(1.12)}
.btn.alt{background:#e6eef7;color:#234}
.btn.green{background:var(--green)}

/* table */
.tools{display:flex;gap:.6em;align-items:center;flex:none;font-size:.9em}
#score{font-weight:800;color:#1f4f85}
table.fiche{width:100%;border-collapse:collapse;font-size:.86em;background:#fff;border-radius:.6em;overflow:hidden;box-shadow:0 .15em .5em rgba(20,40,70,.1)}
.fiche th{background:#1f4f85;color:#fff;padding:.5em .4em;font-size:.92em}
.fiche td{border:1px solid #dfe5ec;padding:.38em .45em;text-align:center}
.fiche td:nth-child(2){text-align:left;font-weight:600}
.fiche td.n{font-weight:900;font-size:1.25em;color:#1f4f85}
.fiche select{font:inherit;width:100%;padding:.25em;border-radius:.35em;border:1.5px solid #b9c6d4;background:#fff}
.fiche td.good{background:var(--green-l)}.fiche td.bad{background:#fde3e3}
.fiche .ans{font-weight:700}
.fiche .ans.ho{color:var(--green-d)}.fiche .ans.he{color:#a85608}

/* quiz */
.quiz{flex:1;display:flex;flex-direction:column;gap:.5em;min-width:0}
.quiz .q{font-weight:800;font-size:1.05em;color:#1f4f85}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:.45em}
.quiz .opt{border:.12em solid #c9d5e2;background:#fff;border-radius:.55em;padding:.55em .7em;text-align:left;font-weight:600;color:var(--ink);transition:transform .12s}
.quiz .opt:hover:not(:disabled){transform:scale(1.02);border-color:#2b6cb0}
.quiz .opt.right{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.quiz .opt.wrong{background:#fde3e3;border-color:#d64545;color:#a12626;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-.3em)}75%{transform:translateX(.3em)}}
.quiz .fb{min-height:2.6em;font-weight:700;font-size:.95em}
.quiz .prog{display:flex;gap:.35em;align-items:center;font-size:.85em;color:#55708c;font-weight:700}
.quiz .dot{width:.9em;height:.9em;border-radius:50%;background:#d5dee8}
.quiz .dot.g{background:var(--green)}.quiz .dot.r{background:#d64545}.quiz .dot.c{outline:.15em solid #2b6cb0}
.final{text-align:center;font-size:1.3em;font-weight:800;color:#1f4f85;margin:auto}
.confetti{position:absolute;top:-3%;width:1cqw;height:1.6cqw;z-index:9;animation:conf 3s ease-in forwards;pointer-events:none}
@keyframes conf{to{transform:translate(var(--x),62cqw) rotate(720deg);opacity:.2}}

/* subtitles + mascot */
#subs{position:absolute;left:1.6%;right:11.8%;bottom:2.2%;height:12%;background:rgba(6,14,26,.82);border:1px solid rgba(120,200,255,.25);
  border-radius:1cqw;color:#fff;font-size:1.55cqw;line-height:1.3;display:flex;align-items:center;gap:1cqw;padding:0 1.4cqw}
#subs .tag{font-size:1.05cqw;background:var(--acc);color:#06302c;font-weight:800;border-radius:.5cqw;padding:.25cqw .7cqw;white-space:nowrap}
#subs b{color:#ffe27a}
#mascot{position:absolute;right:1.4%;bottom:1.2%;width:8.8%;cursor:pointer;border:none;background:none;padding:0;transition:transform .2s}
#mascot:hover{transform:scale(1.05) rotate(-2deg)}
#mascot svg{width:100%;display:block;animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-.5cqw)}}
#mascot .mouth{transform-origin:60px 96px;transform:scaleY(.25)}
#mascot.talking .mouth{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.2)}to{transform:scaleY(1.15)}}
#mascot .lid{animation:blink 4.5s infinite;transform-origin:60px 78px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#mascot .mb{animation:mb 2.2s linear infinite}
@keyframes mb{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}

/* ---------- control deck ---------- */
#deck{width:min(100%,calc((100vh - 158px)*16/9));min-width:300px;background:linear-gradient(180deg,var(--deck2),var(--deck));color:#dbe7f5;
  border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:13px;border:1px solid rgba(255,255,255,.08)}
#tabs{display:flex;gap:4px;flex-wrap:wrap}
#tabs button{flex:1 1 0;min-width:74px;border:none;border-radius:7px;background:#243652;color:#b9c9de;padding:5px 4px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tabs button.cur{background:var(--acc);color:#06302c}
#tabs button:hover:not(.cur){background:#2f4670}
.drow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.drow button{border:none;border-radius:7px;background:#2a3d5e;color:#e7f0fb;padding:6px 9px;font-weight:600;font-size:12.5px;white-space:nowrap}
.drow button:hover{background:#3a5482}
#bPlay{background:var(--acc);color:#06302c;min-width:92px}
#bPlay:hover{background:#7be3d9}
#scrub{flex:1;min-width:120px;accent-color:var(--acc)}
#count{font-variant-numeric:tabular-nums;white-space:nowrap;color:#9fb4cf;font-size:12px}
.drow label{display:flex;align-items:center;gap:5px;font-size:12px;color:#9fb4cf;white-space:nowrap}
#rate{width:84px;accent-color:var(--acc)}
#voice{max-width:190px;background:#243652;color:#e7f0fb;border:1px solid #3a5482;border-radius:6px;padding:4px;font-size:12px}
:focus-visible{outline:2px solid #ffd34d;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bub,#mascot svg{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="bubbles"></div>
    <div id="board"></div>
    <div id="subs"><span class="tag" id="subTag">Scene 1</span><span id="subText"></span></div>
    <button id="mascot" title="Dr. Fizz — click to hear this step again" aria-label="Dr. Fizz: replay narration">
      <svg viewBox="0 0 120 140">
        <rect x="46" y="6" width="28" height="10" rx="4" fill="#9ad1e6" stroke="#2b5f7a" stroke-width="2.5"/>
        <path d="M50 16 V44 L18 108 Q10 128 32 130 H88 Q110 128 102 108 L70 44 V16Z" fill="#eaf8ff" stroke="#2b5f7a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M37 70 H83 L100 108 Q106 126 88 127 H32 Q14 126 20 108Z" fill="#4fd1c5"/>
        <circle class="mb" cx="44" cy="112" r="3" fill="#fff" opacity=".8"/><circle class="mb" cx="78" cy="118" r="2.2" fill="#fff" opacity=".8" style="animation-delay:.8s"/>
        <circle class="mb" cx="62" cy="120" r="2.6" fill="#fff" opacity=".8" style="animation-delay:1.5s"/>
        <g class="lid"><circle cx="47" cy="78" r="8" fill="#fff" stroke="#2b5f7a" stroke-width="2"/><circle cx="73" cy="78" r="8" fill="#fff" stroke="#2b5f7a" stroke-width="2"/>
        <circle cx="48.5" cy="79" r="3.6" fill="#12314d"/><circle cx="74.5" cy="79" r="3.6" fill="#12314d"/></g>
        <path d="M38 67 q9 -6 17 -1 M65 66 q8 -5 17 1" stroke="#2b5f7a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <ellipse class="mouth" cx="60" cy="96" rx="9" ry="7" fill="#7a1f3d" stroke="#12314d" stroke-width="1.5"/>
        <circle cx="36" cy="92" r="4" fill="#ff9db0" opacity=".7"/><circle cx="84" cy="92" r="4" fill="#ff9db0" opacity=".7"/>
      </svg>
    </button>
  </div>

  <div id="deck">
    <div id="tabs" role="tablist" aria-label="Scenes"></div>
    <div class="drow">
      <button id="bPrevS" title="Previous scene">⏮ Scene</button>
      <button id="bPrev" title="Previous step (←)">⏪ Step</button>
      <button id="bPlay" title="Play / Pause (space)">▶ Play</button>
      <button id="bNext" title="Next step (→)">Step ⏩</button>
      <button id="bNextS" title="Next scene">Scene ⏭</button>
      <input type="range" id="scrub" min="0" value="0" step="1" aria-label="Timeline">
      <span id="count"></span>
    </div>
    <div class="drow">
      <button id="bMode" title="Switch between automatic playback and manual teacher mode">🎬 Auto-Play</button>
      <label>Speed <input type="range" id="rate" min="0.75" max="1.35" step="0.05" value="1"><span id="rateV">1.00x</span></label>
      <label>Voice <select id="voice"><option>Default voice</option></select></label>
      <span style="flex:1"></span>
      <button id="bFull">⛶ Full screen</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* =====================================================================
   EXPERIMENT DATA  (textbook page 19)
   ===================================================================== */
const EXPS={
 1:{n:'①',type:'Solid - liquid',add:'Potassium permanganate',base:'Water',cont:'beaker',tool:'spatula',wait:true,
    baseCol:'#d5effa',addCol:'#4a1259',resCol:'#d6249f',homo:true,tag:'Solution',
    say:'Experiment one. Solid, liquid. Potassium permanganate in water. Five minutes later, the liquid is uniformly pink: one single phase. It is a homogeneous mixture, a solution.'},
 2:{n:'②',type:'Solid - solid',add:'Lentils',base:'Flour',cont:'dish',tool:'hand',wait:false,
    baseCol:'#f4eed6',addCol:'#b07a3c',homo:false,tag:null,
    say:'Experiment two. Solid, solid. Lentils in flour. The lentils remain clearly visible in the flour: it is a heterogeneous mixture.'},
 3:{n:'③',type:'Solid - solid',add:'Twigs',base:'Soil',cont:'dish',tool:'hand',wait:false,
    baseCol:'#8a5a33',addCol:'#2b1a0e',homo:false,tag:null,
    say:'Experiment three. Solid, solid. Twigs in soil. The twigs and the soil remain visible separately: it is a heterogeneous mixture.'},
 4:{n:'④',type:'Liquid - liquid',add:'Black ink',base:'Water',cont:'beaker',tool:'ink',wait:true,
    baseCol:'#d5effa',addCol:'#111318',resCol:'#2a2b31',homo:true,tag:'Miscible → solution',
    say:'Experiment four. Liquid, liquid. Black ink in water. Five minutes later, the liquid is uniformly black: one single phase. The two liquids are miscible. They form a solution.'},
 5:{n:'⑤',type:'Liquid - liquid',add:'Nail polish',base:'Water',cont:'beaker',tool:'polish',wait:true,
    baseCol:'#d5effa',addCol:'#e0245e',homo:false,tag:'Immiscible',
    say:'Experiment five. Liquid, liquid. Nail polish in water. Five minutes later, the nail polish sits in a clump at the bottom of the water. They do not form a single phase: the two liquids are immiscible.'},
 6:{n:'⑥',type:'Liquid - liquid',add:'Nail polish',base:'Acetone',cont:'beaker',tool:'polish',wait:true,
    baseCol:'#f6f0b4',addCol:'#e0245e',resCol:'#f4a184',homo:true,tag:'Miscible → solution',
    say:'Experiment six. Liquid, liquid. Nail polish in acetone. Five minutes later, the liquid is uniformly pinkish orange: one single phase. The two liquids are miscible. They form a solution.'}
};

let UID=0;
function rng(seed){let s=seed*7919+13;return()=>(s=(s*9301+49297)%233280)/233280;}

function container(kind,cx,inner){
  const id='c'+(++UID);
  if(kind==='beaker') return `<clipPath id="${id}"><rect x="${cx-42}" y="80" width="84" height="113" rx="9"/></clipPath>
    <g clip-path="url(#${id})">${inner}</g>
    <path d="M${cx-47} 76 q5 1 5 8 V183 q0 10 10 10 H${cx+32} q10 0 10 -10 V84 q0 -7 5 -8" fill="rgba(255,255,255,.14)" stroke="#5f8298" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M${cx-35} 92 V176" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <g stroke="#5f8298" stroke-width="1.2" opacity=".7"><path d="M${cx+30} 110 h9 M${cx+33} 130 h6 M${cx+30} 150 h9 M${cx+33} 170 h6"/></g>`;
  return `<clipPath id="${id}"><path d="M${cx-70} 140 q0 52 30 52 h80 q30 0 30 -52z"/></clipPath>
    <g clip-path="url(#${id})">${inner}</g>
    <path d="M${cx-70} 140 q0 52 30 52 h80 q30 0 30 -52" fill="rgba(255,255,255,.14)" stroke="#5f8298" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="${cx}" cy="140" rx="70" ry="5" fill="none" stroke="#5f8298" stroke-width="1.6" opacity=".7"/>
    <path d="M${cx-60} 150 q3 26 18 34" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>`;

function lentils(cx,n,seed,y0,y1,w){const r=rng(seed);let s='';
  for(let i=0;i<n;i++){const x=cx-w+r()*2*w,y=y0+r()*(y1-y0);
    s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="4.6" ry="3.4" fill="#b07a3c" stroke="#7c5222" stroke-width=".8"/><ellipse cx="${(x-1.2).toFixed(1)}" cy="${(y-1).toFixed(1)}" rx="1.6" ry="1" fill="#d9a868"/>`;}
  return s;}
function twigs(cx,n,seed,y0,y1,w){const r=rng(seed);let s='';
  for(let i=0;i<n;i++){const x=cx-w+r()*2*w,y=y0+r()*(y1-y0),a=r()*180,l=7+r()*7;
    s+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a.toFixed(0)})"><path d="M${-l} 0 H${l} M${l*.2} 0 l4 -4" stroke="#24150a" stroke-width="2.2" stroke-linecap="round" fill="none"/></g>`;}
  return s;}
function speck(cx,n,seed,y0,y1,w,col){const r=rng(seed);let s='';
  for(let i=0;i<n;i++)s+=`<circle cx="${(cx-w+r()*2*w).toFixed(1)}" cy="${(y0+r()*(y1-y0)).toFixed(1)}" r="${(.8+r()*1.2).toFixed(1)}" fill="${col}"/>`;return s;}

function expSVG(k){
  const e=EXPS[k], L=95, R=305, beaker=e.cont==='beaker', top=beaker?118:156;

  const base=cx=>`<rect x="${cx-72}" y="${top}" width="144" height="80" fill="${e.baseCol}"/>`+
     (k===2?speck(cx,26,5,top+3,190,62,'#e4d9b4'):k===3?speck(cx,34,6,top+3,190,62,'#5d3a1c'):'');
  /* ---- BEFORE (left) ---- */
  let inL=base(L);
  if(e.homo) inL+=`<rect class="tint" x="${L-72}" y="${top}" width="144" height="80" fill="${e.resCol}"/>`;
  else if(k===2) inL+=`<g class="bits">${lentils(L,9,21,164,186,52)}</g>`;
  else if(k===3) inL+=`<g class="bits">${twigs(L,8,31,164,186,50)}</g>`;
  else inL+=`<g class="bits"><ellipse cx="${L-18}" cy="150" rx="7" ry="5" fill="#e0245e"/><ellipse cx="${L+12}" cy="166" rx="9" ry="6" fill="#e0245e"/><ellipse cx="${L-6}" cy="180" rx="11" ry="6" fill="#e0245e"/><ellipse cx="${L+20}" cy="142" rx="5" ry="4" fill="#e0245e"/></g>`;
  inL+=surf(L);
  // tool + falling matter
  let tool='',fall='',fx=L-16,fy=66;
  if(e.tool==='spatula'){
    tool=`<path d="M${L-88} 26 L${L-58} 41" stroke="#7a4a22" stroke-width="7" stroke-linecap="round"/><path d="M${L-58} 41 L${L-28} 56" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="${L-19}" cy="60" rx="13" ry="5.5" transform="rotate(26 ${L-19} 60)" fill="#c9d0d8" stroke="#7f8893"/>
      <g fill="${e.addCol}"><circle cx="${L-23}" cy="56" r="2.6"/><circle cx="${L-18}" cy="58" r="2.8"/><circle cx="${L-13}" cy="61" r="2.4"/><circle cx="${L-20}" cy="60" r="2"/></g>`;
    for(let i=0;i<7;i++)fall+=`<circle class="p" cx="${fx+6+(i%3)*4-4}" cy="${fy+(i%2)*3}" r="${2+(i%2)*.6}" fill="${e.addCol}" style="--d:${62+i*4}px;animation-delay:${(i*.15).toFixed(2)}s"/>`;
  }else if(e.tool==='hand'){
    tool=`<g transform="translate(${L-66} 24)"><rect x="-22" y="-6" width="26" height="22" rx="5" fill="#3d6fb5" stroke="#274b80"/>
      <path d="M0 6 q0 -9 10 -9 h26 q12 0 14 12 l4 14 q2 8 -5 9 q-5 0 -7 -6 l-2 -6 -2 10 q-1 7 -7 6 q-5 -1 -5 -7 v-8 l-3 9 q-2 6 -8 4 q-5 -2 -4 -8 l2 -9 h-5 q-8 0 -8 -8z" fill="#f2c7a3" stroke="#bd8559" stroke-width="1.4" stroke-linejoin="round"/></g>`;
    for(let i=0;i<6;i++){const x=L-36+i*6,d=`--d:${88+(i%3)*5}px;animation-delay:${(i*.17).toFixed(2)}s`;
      fall+= k===2?`<ellipse class="p" cx="${x}" cy="${fy+(i%2)*4}" rx="4.4" ry="3.2" fill="${e.addCol}" stroke="#7c5222" stroke-width=".8" style="${d}"/>`
                  :`<path class="p" d="M${x-6} ${fy+(i%2)*4-3} l12 5 m-6 -2 l3 -4" stroke="${e.addCol}" stroke-width="2.2" stroke-linecap="round" fill="none" style="${d}"/>`;}
  }else{
    const ink=e.tool==='ink', mx=L-14,my=64;
    tool=`<g transform="translate(${mx} ${my}) rotate(-62)">`+(ink
      ?`<rect x="-5" y="-11" width="10" height="11" fill="#30343c" stroke="#111"/><rect x="-15" y="-48" width="30" height="38" rx="4" fill="#191b21" stroke="#000"/><rect x="-12" y="-40" width="24" height="18" rx="2" fill="#f4f1e6"/><path d="M-7 -31 h14 M-7 -27 h9" stroke="#333" stroke-width="1.4"/>`
      :`<rect x="-4" y="-10" width="8" height="10" fill="#f3d5dd" stroke="#b0768a"/><path d="M-13 -12 h26 v26 q0 6 -6 6 h-14 q-6 0 -6 -6z" transform="translate(0 -32)" fill="${e.addCol}" stroke="#9a1440" stroke-width="1.4"/><path d="M-9 -40 v18" stroke="#fff" stroke-width="2.5" opacity=".55" stroke-linecap="round"/>`)+`</g>`;
    fall=`<path class="stream" d="M${mx+1} ${my} q5 6 4 18 V${top+4}" stroke="${e.addCol}" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-dasharray="6 3"/>`;
    for(let i=0;i<3;i++)fall+=`<circle class="p" cx="${mx+5}" cy="${top}" r="3" fill="${e.addCol}" style="--d:${26+i*10}px;animation-delay:${(i*.3).toFixed(2)}s"/>`;
  }
  const rx1=beaker?L+30:L+52, ry1=beaker?34:62, rx2=beaker?L+8:L+16, ry2=beaker?184:182;
  const rod=`<g class="rod" style="transform-origin:${rx1}px ${ry1}px"><line x1="${rx1}" y1="${ry1}" x2="${rx2}" y2="${ry2}" stroke="#8fb6c9" stroke-width="5" stroke-linecap="round"/><line x1="${rx1}" y1="${ry1}" x2="${rx2}" y2="${ry2}" stroke="#eefaff" stroke-width="1.8" stroke-linecap="round"/></g>`;
  const ax=rx1-4, ay=ry1+22;
  const rot=`<g class="rot" fill="none" stroke="#e23d3d" stroke-width="2.4" stroke-linecap="round"><path d="M${ax-17} ${ay+2} a17 6.5 0 1 0 14 -8"/><path d="M${ax-9} ${ay-11} l7 5 -8 4" stroke-linejoin="round"/></g>`;
  /* ---- AFTER (right) ---- */
  let inR=base(R);
  if(e.homo) inR+=`<rect x="${R-72}" y="${top}" width="144" height="80" fill="${e.resCol}"/>`;
  else if(k===2) inR+=lentils(R,17,22,162,187,55);

  else inR+=`<path d="M${R-24} 193 q-6 -13 8 -15 q5 -9 17 -4 q15 -2 15 9 q5 6 -2 10z" fill="#e0245e" stroke="#a5143f" stroke-width="1.2"/><ellipse cx="${R-6}" cy="179" rx="6" ry="2.5" fill="#fff" opacity=".45"/>`;
  inR+=surf(R);
  /* ---- arrow ---- */
  const arrow=`<g class="arrow"><path d="M174 152 H220" stroke="#1f4f85" stroke-width="4" stroke-linecap="round"/><path d="M216 143 L230 152 L216 161z" fill="#1f4f85"/>`+
    (e.wait?`<text x="200" y="138" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f4f85">5 min later</text>
      <circle cx="200" cy="108" r="13" fill="#fff" stroke="#1f4f85" stroke-width="2.2"/><path d="M200 97 v2 M200 117 v2 M189 108 h2 M209 108 h2" stroke="#1f4f85" stroke-width="1.4"/>
      <line class="hand" x1="200" y1="108" x2="200" y2="99" stroke="#e23d3d" stroke-width="2" stroke-linecap="round"/><circle cx="200" cy="108" r="1.8" fill="#1f4f85"/>`:'')+`</g>`;
  const lbl=(x,y,t,c)=>`<rect x="${x-24}" y="${y-10}" width="48" height="13" rx="6.5" fill="${c}"/><text x="${x}" y="${y}" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">${t}</text>`;
  return `<svg viewBox="0 0 400 232" role="img" aria-label="Experiment ${k}: ${e.add} + ${e.base}">
    <text x="6" y="15" font-size="12.5" font-weight="700" fill="#33475b">${e.add}</text>
    ${container(e.cont,L,inL)}
    <g class="fall">${fall}</g><g class="tool">${tool}</g>${rod}${rot}
    <text x="${L}" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#33475b">${e.base}</text>

    ${arrow}
    <g class="after">${container(e.cont,R,inR)}</g>
    <g class="lblafter">${lbl(R,227,'AFTER','#1f4f85')}</g>
  </svg>`;

function expCard(k,extra){

}

  <div id="closeup"><div class="box"><div id="cuHost" style="flex:1;display:flex;min-height:0"></div>
    <div class="bar"><span class="phase" id="cuPhase"></span><button class="btn" id="cuReplay">↻ Replay</button><button class="btn alt" id="cuClose">✕ Close</button></div></div></div>`,
/* 7 */stitle(7,SCENES[6].title)+`<div class="tools"><button class="btn" id="bFiche">Switch to Answer mode (all answers shown)</button>
    <button class="btn green" id="bCheck" data-show="1">✔ Check my answers</button><button class="btn alt" id="bReset">↺ Reset</button><span id="score"></span>
    <span style="margin-left:auto;font-weight:700;color:#55708c" id="ficheMode">Exercise mode (to be completed by the student)</span></div>
  <table class="fiche"><thead><tr><th>Exp.</th><th>Substances mixed</th>${FICHE.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="ficheBody"></tbody></table>`,
/* 8 */stitle(8,SCENES[7].title)+`<div class="row" style="align-items:flex-start">
  <div class="col" style="flex:0 0 40%"><div class="bilan" data-show="0"><h3><span>Summary</span>${spk(T.bilanSay)}</h3>${T.bilanHTML}</div>
    <div class="misc" data-show="0" style="font-size:.85em"><span>${T.miscHTML}</span></div></div>
  <div class="card quiz" data-show="1" id="quiz"></div></div>`
].map((h,i)=>`<section class="scene" data-scene="${i}">${h}</section>`).join('');
const sceneEls=$$('.scene');

/* bubbles */
$('#bubbles').innerHTML=Array.from({length:16},(_,i)=>{const s=1+((i*37)%30)/10;
  return `<span class="bub" style="left:${(i*6.3+2)%98}%;width:${s}cqw;height:${s}cqw;animation-duration:${9+(i*5)%11}s;animation-delay:-${(i*1.7)%12}s"></span>`}).join('');

/* =====================================================================
   DETERMINISTIC RENDERER
   ===================================================================== */
let cur=0;             // global step index
let cuTimers=[];
function renderCumulativeState(sceneIndex,stepIndex){
  closeCloseup();
  const scene=SCENES[sceneIndex], el=sceneEls[sceneIndex];
  sceneEls.forEach((s,i)=>s.classList.toggle('active',i===sceneIndex));
  el.querySelectorAll('[data-show]').forEach(n=>n.classList.toggle('on',stepIndex>=+n.dataset.show));
  const st={};
  for(let k=0;k<=stepIndex;k++)Object.assign(st,scene.steps[k].exp||{});
  el.querySelectorAll('.exp[data-exp]').forEach(x=>{ if(!x.closest('#closeup')) x.dataset.state=st[x.dataset.exp]||x.dataset.default||'idle'; });
  $('#subTag').textContent=`Scene ${sceneIndex+1} · ${stepIndex+1}/${scene.steps.length}`;
  $('#subText').innerHTML=scene.steps[stepIndex].sub;
  const g=FLAT.findIndex(f=>f[0]===sceneIndex&&f[1]===stepIndex);
  $('#scrub').value=g; $('#count').textContent=`Step ${g+1} / ${FLAT.length}`;
  $$('#tabs button').forEach((b,i)=>{b.classList.toggle('cur',i===sceneIndex);b.setAttribute('aria-selected',i===sceneIndex)});
}

/* =====================================================================
   VOICE ENGINE (Web Speech API)
   ===================================================================== */
const synth=window.speechSynthesis||null;
let voices=[],voice=null,rate=1,speechTok=0,speakTimer=0,advTimer=0,keepUtter=null;
const PREF=[/natural.*(aria|jenny|guy|sonia|ryan|libby|emma|ava|andrew)/i,/natural/i,/google (us|uk) english/i,/samantha|daniel|karen|moira|alex/i,/microsoft/i];
function loadVoices(){
  if(!synth)return;
  const all=synth.getVoices(); if(!all.length)return;
  const en=all.filter(v=>/^en/i.test(v.lang)); voices=en.length?en:all;
  const score=v=>{const i=PREF.findIndex(r=>r.test(v.name));return (i<0?PREF.length:i)*2+(/en[-_](US|GB)/i.test(v.lang)?0:1)};
  voices.sort((a,b)=>score(a)-score(b));
  const sel=$('#voice'),keep=voice&&voice.name;
  sel.innerHTML=voices.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('');
  voice=voices.find(v=>v.name===keep)||voices[0]; sel.value=voices.indexOf(voice);
}
if(synth){loadVoices();synth.addEventListener&&synth.addEventListener('voiceschanged',loadVoices);}
function setTalking(on){$('#mascot').classList.toggle('talking',on)}
function stopSpeech(){speechTok++;clearTimeout(speakTimer);clearTimeout(advTimer);if(synth)try{synth.cancel()}catch(e){}setTalking(false)}
function speak(text,onend){
  stopSpeech();
  const tok=speechTok;
  const done=()=>{if(tok!==speechTok)return;speechTok++;clearTimeout(speakTimer);setTalking(false);onend&&onend()};
  const est=Math.max(1800,text.length*68/rate);
  setTalking(true);
  if(!synth||!voices.length){speakTimer=setTimeout(done,est);return}   // silent fallback keeps timing
  const u=new SpeechSynthesisUtterance(text);
  u.voice=voice;u.lang=voice?voice.lang:'en-US';u.rate=rate;u.pitch=1.05;u.onend=done;u.onerror=done;
  keepUtter=u; synth.speak(u);
  speakTimer=setTimeout(done,est*2.2+4000);                             // watchdog if onend never fires
}

/* =====================================================================
   PLAYBACK CONTROLLER
   ===================================================================== */
let playing=false,auto=true;
function updPlay(){$('#bPlay').textContent=playing?'⏸ Pause':'▶ Play'}
function runStep(){
  const [si,st]=FLAT[cur];
  speak(SCENES[si].steps[st].narration,()=>{
    if(!playing)return;
    if(auto&&cur<FLAT.length-1){advTimer=setTimeout(()=>{cur++;renderCumulativeState(...FLAT[cur]);runStep()},650)}
    else{playing=false;updPlay()}
  });
}
function go(g,opts){
  g=Math.max(0,Math.min(FLAT.length-1,g));
  const was=playing||(!auto&&!(opts&&opts.silent));
  stopSpeech(); cur=g; renderCumulativeState(...FLAT[cur]);
  playing=was; updPlay();
  if(was)advTimer=setTimeout(runStep,220);
}
function play(){playing=true;updPlay();stopSpeech();runStep()}
function pause(){playing=false;stopSpeech();updPlay()}
function sayOnce(text){playing=false;updPlay();speak(text)}
const sceneStart=i=>FLAT.findIndex(f=>f[0]===i);

$('#tabs').innerHTML=SCENES.map((s,i)=>`<button role="tab" title="Scene ${i+1} — ${s.title}">${i+1} · ${s.tab}</button>`).join('');
$$('#tabs button').forEach((b,i)=>b.onclick=()=>go(sceneStart(i)));
$('#scrub').max=FLAT.length-1;
$('#scrub').oninput=e=>go(+e.target.value);
$('#bPrev').onclick=()=>go(cur-1);
$('#bNext').onclick=()=>go(cur+1);
$('#bPrevS').onclick=()=>{const [si,st]=FLAT[cur];go(sceneStart(st>0?si:Math.max(0,si-1)))};
$('#bNextS').onclick=()=>{const si=FLAT[cur][0];go(si<SCENES.length-1?sceneStart(si+1):FLAT.length-1)};
$('#bPlay').onclick=()=>playing?pause():play();
$('#bMode').onclick=()=>{auto=!auto;$('#bMode').textContent=auto?'🎬 Auto-Play':'👨‍🏫 Manual Mode';if(!auto&&playing)pause()};
$('#rate').oninput=e=>{rate=+e.target.value;$('#rateV').textContent=rate.toFixed(2)+'x'};
$('#voice').onchange=e=>{voice=voices[+e.target.value]||voice};
$('#bFull').onclick=()=>{const a=$('#app');if(document.fullscreenElement)document.exitFullscreen();else (a.requestFullscreen||a.webkitRequestFullscreen||(()=>{})).call(a)};
$('#mascot').onclick=()=>{const [si,st]=FLAT[cur];sayOnce(SCENES[si].steps[st].narration)};
document.addEventListener('click',e=>{
  const b=e.target.closest('.spk'); if(!b)return; e.stopPropagation();
  const [si,st]=FLAT[cur]; sayOnce(b.dataset.say||SCENES[si].steps[st].narration);
},true);
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}
  else if(e.key===' '&&e.target.tagName!=='BUTTON'){playing?pause():play();e.preventDefault()}
  else if(e.key==='Escape')closeCloseup();
  else if(e.key==='Enter'&&e.target.matches('.grid6 .exp'))openCloseup(+e.target.dataset.exp);
});

/* =====================================================================
   SCENE 6 — close-up replay
   ===================================================================== */
const CU=[['idle','Ready…',0],['add','1 · Adding',500],['stir','2 · Stirring with the glass rod',3200],['wait','3 · Waiting',6200],['result','4 · Final result — before / after',8200]];
let cuK=0;
function closeCloseup(){cuTimers.forEach(clearTimeout);cuTimers=[];const c=$('#closeup');if(c){c.classList.remove('open');$('#cuHost').innerHTML=''}}
function openCloseup(k){
  closeCloseup(); cuK=k;
  $('#cuHost').innerHTML=expCard(k,'style="flex:1"');
  $('#closeup').classList.add('open');
  const x=$('#cuHost .exp');
  CU.forEach(([s,label,t])=>cuTimers.push(setTimeout(()=>{
    x.dataset.state=s;
    $('#cuPhase').textContent=(s==='wait'&&!EXPS[k].wait)?'3 · After mixing →':label;
  },t)));
}
$('.grid6').addEventListener('click',e=>{if(e.target.closest('.spk'))return;const x=e.target.closest('.exp');if(x){pause();openCloseup(+x.dataset.exp)}});
$('#cuClose').onclick=closeCloseup;
$('#cuReplay').onclick=()=>openCloseup(cuK);
$('#closeup').addEventListener('click',e=>{if(e.target.id==='closeup')closeCloseup()});

/* =====================================================================
   SCENE 7 — worksheet 2.4 table
   ===================================================================== */
let ficheAnswers=false; const ficheVals={};
function renderFiche(){
  $('#ficheBody').innerHTML=[1,2,3,4,5,6].map(k=>{const e=EXPS[k],ans=FICHE.rows[k];
    return `<tr><td class="n">${e.n}</td><td>${e.add} + ${e.base}</td>`+ans.map((a,c)=>{
      if(ficheAnswers)return `<td><span class="ans ${c===2?(a===0?'ho':'he'):''}">${FICHE.opts[c][a]}</span></td>`;
      const v=ficheVals[k+'-'+c];
      return `<td><select data-k="${k}" data-c="${c}" aria-label="Experiment ${k}: ${FICHE.cols[c]}"><option value="">…</option>${FICHE.opts[c].map((o,i)=>`<option value="${i}" ${v===i?'selected':''}>${o}</option>`).join('')}</select></td>`;
    }).join('')+'</tr>'}).join('');
  $('#bFiche').textContent=ficheAnswers?'Switch to Exercise mode (to be completed by the student)':'Switch to Answer mode (all answers shown)';
  $('#ficheMode').textContent=ficheAnswers?'Answer mode (all answers shown)':'Exercise mode (to be completed by the student)';
  $('#bCheck').style.visibility=$('#bReset').style.visibility=ficheAnswers?'hidden':'visible';
  $('#score').textContent='';
}
$('#ficheBody').addEventListener('change',e=>{const s=e.target;if(s.tagName!=='SELECT')return;
  if(s.value==='')delete ficheVals[s.dataset.k+'-'+s.dataset.c];else ficheVals[s.dataset.k+'-'+s.dataset.c]=+s.value;
  s.parentNode.className='';});
$('#bFiche').onclick=()=>{ficheAnswers=!ficheAnswers;renderFiche()};
$('#bReset').onclick=()=>{Object.keys(ficheVals).forEach(k=>delete ficheVals[k]);renderFiche()};
$('#bCheck').onclick=()=>{let ok=0;
  $$('#ficheBody select').forEach(s=>{const good=s.value!==''&&+s.value===FICHE.rows[s.dataset.k][s.dataset.c];
    s.parentNode.className=s.value===''?'':(good?'good':'bad');if(good)ok++});
  $('#score').textContent=`Score: ${ok} / 24`+(ok===24?' 🎉 Perfect!':'');
  if(ok===24)confetti();};
renderFiche();

/* =====================================================================
   SCENE 8 — quiz
   ===================================================================== */
let qi=0,qRes=[];
function renderQuiz(){
  const host=$('#quiz');
  const dots=QUIZ.map((_,i)=>`<span class="dot ${qRes[i]===true?'g':qRes[i]===false?'r':''} ${i===qi?'c':''}"></span>`).join('');
  if(qi>=QUIZ.length){
    const n=qRes.filter(Boolean).length;
    host.innerHTML=`<div class="prog">${dots}</div><div class="final">${n===4?'🏆':n>=2?'👏':'💪'} Your score: ${n} / 4<br>
      <span style="font-size:.7em;font-weight:600;color:#55708c">${n===4?'Perfect! You master mixtures.':'Review the experiments and try again!'}</span><br><br>
      <button class="btn" id="qAgain">↺ Try again</button></div>`;
    $('#qAgain').onclick=()=>{qi=0;qRes=[];renderQuiz()};
    return;
  }
  const Q=QUIZ[qi];
  host.innerHTML=`<div class="prog">${dots}<span>Question ${qi+1} / ${QUIZ.length}</span><span style="flex:1"></span>${spk(Q.say)}</div>
    <div class="q">${Q.q}</div><div class="opts">${Q.o.map((o,i)=>`<button class="opt" data-i="${i}">${'ABCD'[i]}. ${o}</button>`).join('')}</div>
    <div class="fb" id="qFb"></div>`;
  host.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,good=i===Q.a; qRes[qi]=good;
    host.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===Q.a)x.classList.add('right')});
    if(!good)b.classList.add('wrong');
    $('#qFb').innerHTML=`<span style="color:${good?'var(--green-d)':'#a12626'}">${good?'✅ Correct!':'❌ Not quite.'}</span> ${Q.why}
      <button class="btn" id="qNext" style="margin-left:.6em">${qi===QUIZ.length-1?'See my score':'Next question →'}</button>`;
    $('#qNext').onclick=()=>{qi++;renderQuiz();if(qi>=QUIZ.length)confetti()};
    $('#qNext').focus();
  });
}
function confetti(){
  const st=$('#stage'),cols=['#ff5d73','#ffd34d','#4fd1c5','#7aa2ff','#9be564','#ff9f43'];
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='confetti';
    c.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};--x:${(Math.random()*20-10).toFixed(1)}cqw;animation-delay:${(Math.random()*.8).toFixed(2)}s;animation-duration:${(2.2+Math.random()*1.6).toFixed(2)}s`;
    c.addEventListener('animationend',()=>c.remove());st.appendChild(c);}
}
renderQuiz();

/* expose for teachers / debugging */
window.renderCumulativeState=renderCumulativeState;
renderCumulativeState(0,0); updPlay();
window.addEventListener('beforeunload',()=>synth&&synth.cancel());
})();
</script>
</body>
